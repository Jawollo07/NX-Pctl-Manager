services:
  nxpctl-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NXPCTL_DATABASE: /var/lib/nxpctl/nxpctl.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nxpctl-data:/var/lib/nxpctl
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nxpctl-data:

services:
  nxpctl-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NXPCTL_DATABASE: /var/lib/nxpctl/nxpctl.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nxpctl-data:/var/lib/nxpctl
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
volumes:
  nxpctl-data:

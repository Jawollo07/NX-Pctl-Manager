name: sysmodule-build

on:
  push:
    branches: [ feature/headless-sysmodule-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sysmodule-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - name: Checkout NX-Pctl-Manager
        uses: actions/checkout@v4
        with:
          path: project
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q server/test_*.py

  build-sysmodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NX-Pctl-Manager
        uses: actions/checkout@v4
        with:
          path: project

      - name: Verify shared protocol and accounting tests
        run: |
          set -euo pipefail
          for test in runtime_protocol worker_supervision policy_engine policy_json policy_evaluator usage_tracker http_response http_request provisioning trusted_clock; do
            c++ -std=c++17 -Wall -Wextra -Werror "project/tests/${test}_test.cpp" -o "$RUNNER_TEMP/${test}-test"
            "$RUNNER_TEMP/${test}-test"
          done

      - name: Checkout pinned libnx submodule
        run: git -C project submodule update --init deps/libnx

      - name: Checkout pinned Atmosphere source
        uses: actions/checkout@v4
        with:
          repository: Atmosphere-NX/Atmosphere
          ref: 6b0c077b4c608a3a2ee712b8dc35fee87ceb62e8
          path: atmosphere

      - name: Checkout pinned switch-tools
        uses: actions/checkout@v4
        with:
          repository: switchbrew/switch-tools
          ref: 22756068dd0ed6ff9734c59cb4f99ebd3f62555b
          path: switch-tools

      - name: Build host-side Switch packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake liblz4-dev zlib1g-dev pkg-config
          cd switch-tools
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/switch-tools-install"
          make -j"$(nproc)"
          make install

      - name: Build experimental Stratosphere module
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/switch-tools-install/bin:/host-switch-tools:ro" \
            -w /work/project \
            devkitpro/devkita64 \
            bash -lc '
              set -euo pipefail
              export PATH="/host-switch-tools:$PATH"
              git config --global --add safe.directory /work/project
              git config --global --add safe.directory /work/atmosphere
              test -n "${DEVKITPRO:-}" || { echo "DEVKITPRO is not set" >&2; exit 1; }
              for tool in npdmtool elf2nso build_pfs0; do
                command -v "$tool" >/dev/null || { echo "Missing required Switch packaging tool: $tool" >&2; exit 1; }
              done
              make -C deps/libnx -j"$(nproc)"
              make -C deps/libnx install
              make -C sysmodule ATMOSPHERE_ROOT=/work/atmosphere nx_release
            '

      - name: Verify packaged sysmodule
        shell: bash
        run: |
          mapfile -t nsp_files < <(find project/sysmodule/out -type f -name '*.nsp' -size +0c -print)
          if [ "${#nsp_files[@]}" -ne 1 ]; then
            echo "Expected exactly one non-empty NSP, found ${#nsp_files[@]}" >&2
            printf '%s\\n' "${nsp_files[@]}" >&2
            exit 1
          fi
          mkdir -p project/sysmodule/artifacts
          cp "${nsp_files[0]}" project/sysmodule/artifacts/nx_pctl_manager.nsp
          file project/sysmodule/artifacts/nx_pctl_manager.nsp

      - name: Upload experimental sysmodule artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx-pctl-manager-sysmodule-experimental
          path: project/sysmodule/artifacts/nx_pctl_manager.nsp
          if-no-files-found: error

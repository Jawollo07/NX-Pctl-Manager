name: Central control server checks

on:
  push:
    branches: [feature/central-control-server]
    paths:
      - "server/**"
      - ".github/workflows/central-control-server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/central-control-server.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - run: python -m compileall -q server
      - run: pytest -q server/tests

name: build

on:
  push:
    branches: [ main, migration/plutonium-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, migration/plutonium-ui ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Use the official devkitPro aarch64 image for a reproducible Switch build.
      # The root Makefile builds the Plutonium submodule first, then the app.
      - name: Build .nro / .zip (devkitpro/devkita64)
        run: docker run --rm -v "$PWD:/project" -w /project devkitpro/devkita64 make dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nx_pctl_manager
          if-no-files-found: error
          path: |
            nx_pctl_manager.nro
            nx_pctl_manager.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nx_pctl_manager.nro
            nx_pctl_manager.zip

name: Server backend tests

on:
  push:
    branches:
      - feature/headless-sysmodule-migration
    paths:
      - "server/**"
      - "tools/provisioner/**"
      - "protocol/provisioning.hpp"
      - "tests/provisioning_config_test.cpp"
      - "sysmodule/source/secure_crypto.*"
      - "protocol/secure_http-protocol.md"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "tools/provisioner/**"
      - "protocol/provisioning.hpp"
      - "tests/provisioning_config_test.cpp"
      - ".github/workflows/server-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run backend unit tests
        run: python -m unittest discover -s server/tests -v
      - name: Validate administration dashboard JavaScript
        run: node --check server/static/admin.js
